<!DOCTYPE html>
<html lang="ka">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VSCC Game Professional</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="guess.css">
</head>
<body>

<!-- Background -->
<div class="bg-container">
  <div class="bg-gif" id="bgGif"></div>
  <video id="endVideo" autoplay loop style="position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:none; z-index:1;"></video>
  <div class="bg-overlay" id="bgOverlay" style="z-index:2;"></div>
</div>

<!-- Hidden audio elements -->
<audio id="audioPlayer"></audio>
<audio id="bgMusic" loop autoplay preload="auto"></audio>
<audio id="audioCorrect" src="audio/correct.mp3"></audio>
<audio id="audioWrong" src="audio/wrong.mp3"></audio>

<!-- Start Menu -->
<div class="menu-container" id="menuContainer">
  <div class="menu-card">
    <h1 class="menu-title">მიაუ By REIJEI</h1>
    <div class="menu-buttons">
      <button class="btn menu-btn" id="startBtn">თამაშის დაწყება</button>
      <button class="btn menu-btn" id="optionsBtn">პარამეტრები</button>
      <button class="btn menu-btn" id="aboutBtn">მაიუ</button>
    </div>
  </div>
</div>

<!-- Options Screen -->
<div class="options-container" id="optionsContainer" style="display:none;">
  <div class="options-card">
    <h2>პარამეტრები</h2>
    <div class="option-item">
      <label for="volumeSlider">მუსიკის ხმა:</label>
      <input type="range" id="volumeSlider" min="0" max="1" step="0.01" value="0.02">
    </div>
    <div class="option-item">
      <label for="languageSelect">ენა:</label>
      <select id="languageSelect">
        <option value="ka">ქართული</option>
        <option value="en">English</option>
      </select>
    </div>
    <button class="btn back-btn" id="backFromOptions">დაბრუნება</button>
  </div>
</div>

<!-- About Screen -->
<div class="about-container" id="aboutContainer" style="display:none;">
  <div class="about-card">
    <h2>მაიუ</h2>
    <video id="funnyVideo" controls width="600" height="450">
      <source src="video/funny.mp4" type="video/mp4">
      Your browser does not support the video tag.
    </video>
    <button class="btn back-btn" id="backFromAbout">დაბრუნება</button>
  </div>
</div>

<!-- Main content -->
<div class="main-container" id="gameContainer" style="display:none;">

  <!-- Game card -->
  <div class="game-card">
    <div class="audio-row">
      <button class="btn" id="replayBtn">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z" fill="white"/>
        </svg>
        მოუსმინე
      </button>
      <div class="volume-control">
        <label for="audioVolumeSlider">ხმა:</label>
        <input type="range" id="audioVolumeSlider" min="0" max="1" step="0.01" value="1">
      </div>
      <span id="statusText">მზადება</span>
    </div>

    <div class="title" id="questionTitle">მოუსმინეთ ხმას და აირჩიეთ სწორი სურათი</div>

    <div class="choices-grid" id="choices"></div>

    <button class="btn" id="nextBtn" style="display:none; align-self:center;">შემდეგი ხმა</button>
  </div>

  <!-- Score panel -->
  <div class="score-panel">
    <div class="round-info">რაუნდი: <span id="roundIdx">0</span>/<span id="roundTotal">0</span></div>
    <div class="counts">
      <span>სწორი: <span id="correctCount">0</span></span>
      <span>არასწორი: <span id="wrongCount">0</span></span>
    </div>
  </div>

</div>

<!-- End modal -->
<div class="modal" id="endModal">
  <div class="modal-card">
    <h2>თამაში დასრულდა</h2>
    <p id="endScore" style="font-weight:800;margin-top:6px"></p>
    <div class="modal-buttons">
      <button class="btn" id="backToMenuBtn">მენიუში დაბრუნება</button>
    </div>
  </div>
</div>

<script src="guess.js"></script>
</body>
</html>
